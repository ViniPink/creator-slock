<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000000;
    min-height: 100vh;
  }

  body {
    background-image: radial-gradient(rgba(230,202,170,0.14) 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex;
    justify-content: center;
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .figma-svg {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
  }

  .overlay-field {
    position: absolute;
    background: transparent;
    border: none;
    border-radius: 9px;
    outline: none;
    color: #f3ede3;
    caret-color: #f3ede3;
    font-family: Poppins, -apple-system, sans-serif;
  }

  .overlay-field::placeholder {
    color: #a9a9a9;
    font-family: Poppins, -apple-system, sans-serif;
  }

  .overlay-field:focus {
    box-shadow: 0 0 0 2px rgba(230,202,170,0.3);
  }

  .overlay-btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  .status {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #e6caaa;
    font-family: Poppins, -apple-system, sans-serif;
  }

  #f-nome    { left: 12%;     top: 22.65%;  width: 76%;    height: 4.084%; font-size: 3.6vw; padding-left: 4%; }
  #f-email   { left: 12%;     top: 27.323%; width: 76%;    height: 4.045%; font-size: 3.6vw; padding-left: 4%; }
  #f-telefone{ left: 12%;     top: 31.956%; width: 76%;    height: 4.084%; font-size: 3.6vw; padding-left: 4%; }
  #btn-avise { left: 31.961%; top: 38.966%; width: 41.167%; height: 2.749%; }
  #status    { top: 43%; }

  @media (min-width: 480px) {
    #f-nome, #f-email, #f-telefone { font-size: 15px; }
    .status { font-size: 13px; }
  }
</style>
